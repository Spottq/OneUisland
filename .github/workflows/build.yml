name: Build APK

on:
  push:
    branches:
      - main
      - feature/notification-updates
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*-release*.apk' ! -name '*-unsigned.apk' -print -quit)
          test -n "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          cp "$apk" app/build/outputs/apk/release/OneUisland-1.4.7.apk

      - name: Upload testing APK
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: OneUisland-1.4.7
          path: app/build/outputs/apk/release/OneUisland-1.4.7.apk

