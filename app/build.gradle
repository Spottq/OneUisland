plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.flexy.dynamicisland'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.flexy.dynamicisland'
        minSdk 35
        targetSdk 36
        versionCode 147
        versionName '1.4.7'
        testInstrumentationRunner 'dev.flexy.dynamicisland.tests.RegressionRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    compileOnly project(':stubs')
    androidTestImplementation project(':stubs')
}
